# Production stack: Postgres, a one-shot migrator, the API and the web app.
#
# Setup, from this folder:
#   1. cp .env.example .env            and fill it in (git-ignored).
#   2. Put the OpenIddict signing certificate at certs/openiddict.pfx (git-ignored), e.g.
#        dotnet dev-certs https -v -ep certs/openiddict.pfx -p <OPENIDDICT_CERT_PASSWORD>
#      or a certificate from your own CA. Keep it: replacing it signs every user out.
#      The api runs as a non-root user, so make the file readable (it is password-protected):
#        chmod 644 certs/openiddict.pfx
#   3. docker compose up -d --build
#
# TLS is not handled here. Whatever sits in front (a cloud load balancer, Caddy, nginx, Traefik)
# terminates https and forwards, adding X-Forwarded-For/-Proto/-Host:
#   ${API_URL} -> 127.0.0.1:8080 (api)       ${APP_URL} -> 127.0.0.1:8081 (web)
# Both ports are bound to localhost only, so nothing reaches the containers around the proxy.
#
# Upgrading: git pull && docker compose up -d --build — the migrator runs again first and the
# api only starts once it has finished successfully.
#
# Running more than one api: background work (email jobs, token cleanup, booking reminders) is
# kept to one server at a time by Postgres advisory locks. They need a session-level connection,
# so put PgBouncer (if any) in session-pooling mode, not transaction pooling.

name: dixels

# Each container's log is rotated at 10 MB, keeping 5 files (about 50 MB at most). Docker's
# default never rotates, and a busy api fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  # Maximum Pool Size caps the connections one api opens (Npgsql's default is 100, the same as
  # Postgres's max_connections, so two apis could exhaust the server). Raise both together.
  ConnectionStrings__Default: "Host=db;Port=5432;Database=Dixels;User ID=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env};Maximum Pool Size=${DB_POOL_SIZE:-50}"
  StringEncryption__DefaultPassPhrase: ${STRING_ENCRYPTION_PASSPHRASE:?set STRING_ENCRYPTION_PASSPHRASE in .env}
  Settings__Abp.Mailing.Smtp.Host: ${SMTP_HOST:?set SMTP_HOST in .env}
  Settings__Abp.Mailing.Smtp.Port: ${SMTP_PORT:?set SMTP_PORT in .env}
  Settings__Abp.Mailing.Smtp.EnableSsl: ${SMTP_ENABLE_SSL:?set SMTP_ENABLE_SSL in .env}
  Settings__Abp.Mailing.Smtp.UseDefaultCredentials: "false"
  Settings__Abp.Mailing.Smtp.UserName: ${SMTP_USER:?set SMTP_USER in .env}
  Settings__Abp.Mailing.Smtp.Password: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
  Settings__Abp.Mailing.DefaultFromAddress: ${SMTP_FROM:?set SMTP_FROM in .env}
  Settings__Abp.Mailing.DefaultFromDisplayName: Dixels

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    # Time for a clean shutdown (a checkpoint) before Docker kills it; the default 10s can
    # force crash recovery on the next start.
    stop_grace_period: 60s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: Dixels
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Dixels"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrator:
    build:
      context: ../backend
      target: migrator
    logging: *logging
    environment:
      <<: *backend-env
      Dixels__AdminEmail: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      Dixels__AdminPassword: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      Dixels__DemoData: "false"
      # The OIDC clients' redirect URLs are seeded from these (and updated on every run).
      OpenIddict__Applications__Dixels_App__RootUrl: ${APP_URL:?set APP_URL in .env}
      OpenIddict__Applications__Dixels_Swagger__RootUrl: ${API_URL:?set API_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../backend
      target: web
    restart: unless-stopped
    logging: *logging
    # .NET waits up to 30s for requests and the running background job to finish after
    # SIGTERM; Docker's default 10s would kill it halfway.
    stop_grace_period: 40s
    # The image checks /health/live (the process answers). Here it's /health/ready, which also
    # needs the database, so `docker compose ps` shows the api unhealthy while it can't serve.
    # Nothing depends_on the api, so this never blocks another service from starting.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 3
    environment:
      <<: *backend-env
      App__SelfUrl: ${API_URL}
      App__CorsOrigins: ${APP_URL}
      Emails__AppUrl: ${APP_URL}
      AuthServer__CertificatePath: /certs/openiddict.pfx
      AuthServer__CertificatePassword: ${OPENIDDICT_CERT_PASSWORD:?set OPENIDDICT_CERT_PASSWORD in .env}
      ForwardedHeaders__Enabled: "true"
      DataProtection__KeysPath: /keys
      BlobStoring__FileSystem__BasePath: /blobs
    volumes:
      - ./certs:/certs:ro
      - dataprotection:/keys
      # Uploaded files (profile pictures). Back this volume up along with the database.
      - blobs:/blobs
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

  web:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${API_URL}
        VITE_OIDC_AUTHORITY: ${API_URL}
        VITE_OIDC_REDIRECT_URI: ${APP_URL}/callback
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${APP_URL}/
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:
  dataprotection:
  blobs:
