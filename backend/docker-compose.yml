# Runs the backend in Docker against the Postgres already running on Windows.
# One-time setup:
#   1. cp .env.example .env   and fill in the values (git-ignored).
#   2. Export the HTTPS dev cert:
#        dotnet dev-certs https -ep "%USERPROFILE%\.aspnet\https\dixels.pfx" -p dixels-dev
#        dotnet dev-certs https --trust
services:
  web:
    # Development image (runs from source). The production image is ./Dockerfile - see deploy/.
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "44334:44334"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:44334
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/dixels.pfx
    volumes:
      - ${USERPROFILE}/.aspnet/https:/https:ro
    depends_on:
      - smtp4dev

  # Fake mail server: catches every email the backend sends, delivers none of them.
  # Inbox: http://localhost:5000. The backend reaches its SMTP port as smtp4dev:25.
  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "5000:80"
